<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Headless Motion verify loop diagram">
  <rect x="0" y="0" width="1200" height="300" rx="16" fill="#0F1E1C"/>
  <text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#F4F1EA">The loop: write, render, check, fix</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="40" y="100" width="240" height="110" rx="12" fill="#E4572E"/>
    <circle cx="80" cy="140" r="20" fill="#0F1E1C"/>
    <text x="80" y="148" text-anchor="middle" font-size="20" font-weight="bold" fill="#F4F1EA">1</text>
    <text x="165" y="136" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">Write a scene</text>
    <text x="165" y="164" text-anchor="middle" font-size="14" fill="#FFFFFF">one JSON file</text>
    <rect x="330" y="100" width="240" height="110" rx="12" fill="#1E3A35" stroke="#2A9D8F" stroke-width="2"/>
    <circle cx="370" cy="140" r="20" fill="#2A9D8F"/>
    <text x="370" y="148" text-anchor="middle" font-size="20" font-weight="bold" fill="#0F1E1C">2</text>
    <text x="455" y="136" text-anchor="middle" font-size="19" font-weight="bold" fill="#F4F1EA">Render it</text>
    <text x="455" y="164" text-anchor="middle" font-size="14" fill="#B8C4BE">one command, MP4 out</text>
    <rect x="620" y="100" width="240" height="110" rx="12" fill="#1E3A35" stroke="#2A9D8F" stroke-width="2"/>
    <circle cx="660" cy="140" r="20" fill="#2A9D8F"/>
    <text x="660" y="148" text-anchor="middle" font-size="20" font-weight="bold" fill="#0F1E1C">3</text>
    <text x="745" y="136" text-anchor="middle" font-size="19" font-weight="bold" fill="#F4F1EA">Check every frame</text>
    <text x="745" y="164" text-anchor="middle" font-size="14" fill="#B8C4BE">scores, not opinions</text>
    <rect x="910" y="100" width="250" height="110" rx="12" fill="#E8A33D"/>
    <circle cx="950" cy="140" r="20" fill="#0F1E1C"/>
    <text x="950" y="148" text-anchor="middle" font-size="20" font-weight="bold" fill="#F4F1EA">4</text>
    <text x="1040" y="136" text-anchor="middle" font-size="19" font-weight="bold" fill="#141414">Fix the worst gap</text>
    <text x="1040" y="164" text-anchor="middle" font-size="14" fill="#141414">biggest Delta E first</text>
    <g fill="#2A9D8F">
      <polygon points="280,155 308,145 308,165"/>
      <polygon points="570,155 598,145 598,165"/>
      <polygon points="860,155 888,145 888,165"/>
    </g>
    <path d="M 1035 240 L 1035 262 L 160 262 L 160 222" fill="none" stroke="#E4572E" stroke-width="2" stroke-dasharray="6 5"/>
    <polygon points="160,222 154,236 166,236" fill="#E4572E"/>
    <text x="600" y="280" text-anchor="middle" font-size="15" fill="#E4572E">repeat until the numbers pass, or the gap is named and accepted</text>
  </g>
</svg>
